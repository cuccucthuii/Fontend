# ========== GOOGLE OAUTH2 CONFIGURATION (REAL) ==========
# Thay thế các giá trị này bằng credentials thực tế từ Google Cloud Console

# Google OAuth2 Configuration - REAL VALUES
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-actual-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-actual-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Facebook OAuth2 Configuration - REAL VALUES  
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:your-actual-facebook-client-id}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:your-actual-facebook-client-secret}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# OAuth2 Provider Configuration (không cần thay đổi)
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# JWT Configuration for Social Login
jwt.social.secret=${JWT_SOCIAL_SECRET:your-super-secret-jwt-key-for-social-login-2024}
jwt.social.expiration=${JWT_SOCIAL_EXPIRATION:86400000}

# Frontend URL Configuration
app.cinema.website=${FRONTEND_URL:http://localhost:5173}

# ========== INSTRUCTIONS ==========
# 1. Tạo file .env với các giá trị thực:
#    GOOGLE_CLIENT_ID=your-actual-google-client-id
#    GOOGLE_CLIENT_SECRET=your-actual-google-client-secret
#    FACEBOOK_CLIENT_ID=your-actual-facebook-client-id
#    FACEBOOK_CLIENT_SECRET=your-actual-facebook-client-secret
#
# 2. Hoặc thay thế trực tiếp các giá trị placeholder
#
# 3. Đảm bảo redirect URIs trong Google/Facebook Console khớp với:
#    - http://localhost:8081/login/oauth2/code/google
#    - http://localhost:5173/auth/google/callback
