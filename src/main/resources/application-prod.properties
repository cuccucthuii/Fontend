# Production Environment Configuration
spring.profiles.active=prod

# Database Configuration (Production)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cinema_reservation_prod}
spring.datasource.username=${DATABASE_USERNAME:cinema_user}
spring.datasource.password=${DATABASE_PASSWORD:secure_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# VNPay Configuration - Production
vnpay.tmnCode=${VNPAY_TMN_CODE_PROD}
vnpay.hashSecret=${VNPAY_HASH_SECRET_PROD}
vnpay.payUrl=https://vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${VNPAY_RETURN_URL_PROD}
vnpay.ipnUrl=${VNPAY_IPN_URL_PROD}
vnpay.locale=vn
vnpay.currCode=VND
vnpay.version=2.1.0
vnpay.timeout=30000
vnpay.enableSignatureValidation=true
vnpay.enableAmountValidation=true

# Security Configuration
jwt.secret=${JWT_SECRET_PROD}
jwt.expiration=86400000

# Server Configuration
server.port=${PORT:8081}
server.servlet.context-path=/

# Logging Configuration
logging.level.org.example.cinema_reservation_system=INFO
logging.level.org.springframework.security=WARN
logging.file.name=logs/cinema-reservation.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email Configuration (Production)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


































